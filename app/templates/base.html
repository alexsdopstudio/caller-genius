<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Caller Genius</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,sans-serif;color:#18283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#11243a;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1280px;margin:40px auto;padding:0 24px}h1{font-size:32px;letter-spacing:-1px}h2{font-size:20px}.badge{font-size:12px;background:#24455d;color:#b7f3df;padding:8px 12px;border-radius:20px}.card{background:white;border:1px solid #dce4ed;border-radius:16px;padding:26px;margin-bottom:24px;box-shadow:0 6px 20px #172e4710}label{display:block;font-size:14px;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #c7d3df;border-radius:7px;font:inherit}input[type=checkbox]{width:auto}button,.button{display:inline-block;border:0;border-radius:7px;padding:11px 15px;background:#067465;color:white;cursor:pointer;text-decoration:none;font:inherit;font-size:14px}button:disabled{opacity:.5;cursor:wait}button.secondary,.secondary{background:#e9eff5;color:#203b57}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;vertical-align:top;padding:16px 10px;border-bottom:1px solid #e3e9ef}th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#63748a}small,.muted{color:#607185}textarea{width:100%;min-height:100px;border:1px solid #d8e1ea;border-radius:6px;padding:10px}td button,td a{margin:4px 0}.notice{padding:14px;background:#eef5ff;border-radius:8px;margin:15px 0}.error{color:#a62a35}#feedback{white-space:pre-wrap}a{color:#067465}.scroll{overflow:auto}.demo{max-width:620px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:700;color:#067465}
</style></head><body><header><strong>Caller Genius</strong><span class="badge">AUDIT → DEMO → APPUNTAMENTO</span></header>{% block content %}{% endblock %}</body></html>
